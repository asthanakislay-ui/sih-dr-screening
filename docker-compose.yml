version: '3.8'

services:
  # AI Service - FastAPI + PyTorch ML Inference
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: sih-dr-ai
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ai/weights:/app/weights:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Backend Service - Node.js + Express + MongoDB
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih-dr-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ML_SERVICE_URL=http://ai:8000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Frontend Service - React + Vite (served by nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih-dr-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_AI_BASE_URL=http://localhost:8000
      - VITE_BACKEND_BASE_URL=http://localhost:5000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  default:
    name: sih-dr-network